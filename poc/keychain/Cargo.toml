[package]
name = "poc-keychain"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = ["pam-kcpoc"]
default-members = [".", "pam-kcpoc"]

[[bin]]
name = "kc-poc"
path = "src/main.rs"

[dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
core-foundation = "0.10.1"

[build-dependencies]
cc = "1.2.0"
